<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="content-language" content="ja" />

    <title>Juggling Donuts</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css"
    />
    {% if has_slider %}
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css"
    />
    {% endif %}
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="shortcut icon" href="/img/icon.ico" />
    <link rel="apple-touch-icon" href="/img/apple_touch_icon.png" />
    <link rel="icon" type="image/png" href="/img/android_chrome.png" />
  </head>

  <body>
    <div id="menu-wrapper">
      <a id="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </a>
    </div>
    <header>
      <nav>
        <ul>
          <li><a href="/index.html">TOP</a></li>
          <li><a href="/members.html">メンバー紹介</a></li>
          <li><a href="/irai.html">出演依頼</a></li>
        </ul>
      </nav>
    </header>
    <main>
      {% block content %} {% endblock %}
    </main>
    <footer>
      <div class="footer-inner">
        <div class="footer-top">
          <nav>
            <ul class="flex">
              <li class="nav-item">
                <a href="/index.html" class="nav-link">TOP</a>
              </li>
              <li class="nav-item">
                <a href="/members.html" class="nav-link">メンバー紹介</a>
              </li>
              <li class="nav-item">
                <a href="/irai.html" class="nav-link">出演依頼</a>
              </li>
            </ul>
          </nav>
          <a href="index.html" class="footer-icon">
            <img src="/img/icon.svg" alt="Top" />
          </a>
        </div>
      </div>
      <div class="footer-bottom">&copy; 2017-2027 Juggling Donuts</div>
    </footer>
    <script src="/js/animations.js"></script>
    <script>
      const menuToggle = document.getElementById("menu-toggle");
      const headerNav = document.querySelector("header nav");
      const navLinks = document.querySelectorAll("header nav li a");

      menuToggle?.addEventListener("click", function () {
        const header = headerNav?.closest("header");
        this.classList.toggle("active");
        header?.classList.toggle("is-open");
      });

      navLinks.forEach((link) => {
        link.addEventListener("click", () => {
          menuToggle?.classList.remove("active");
          headerNav?.closest("header")?.classList.remove("is-open");
        });
      });
    </script>
    {% if has_slider %}
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <script>
      document.querySelectorAll(".splide").forEach((el) => {
        new Splide(el, {
          type: "loop",
          autoplay: true,
          gap: "1rem",
        }).mount();
      });
    </script>
    {% endif %}
  </body>
</html>
